<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinHub loading screen</title>
<style>
/* Every size is a real dp / sp of PreloaderOverlay.kt. --d = 1 dp. Palette = Marcescence (the default DeckPalette). */
:root{--bg:#0A0B0D;--su:#121417;--sv:#1A1D22;--pr:#1A9FFF;--onpr:#03111F;--ln:#262A31;--ln2:#343A43;--hero:#F3F5F8;--dim:#B6BCC6;--err:#CF6679;--errc:#5c1f2b;--onerr:#ffdad9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;font-family:Roboto,system-ui,"Segoe UI",sans-serif;color:#fff;overflow:hidden}
body{display:flex;flex-direction:column}
/* simulator chrome (not part of the app) */
.bar{flex:none;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#101114;border-bottom:1px solid #26292f;font-size:12px}
.bar b{color:#8a93a0;font-weight:600;margin-right:2px}
.bar button{font:inherit;color:#d8dde5;background:#1a1d22;border:1px solid #2e333b;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:32px}
.bar button.on{background:var(--pr);border-color:var(--pr);color:var(--onpr);font-weight:700}
.bar .sp{flex:1}
.stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.frame{container-type:size;position:relative;overflow:hidden;background:var(--bg);width:min(100cqw,100cqh*20/9);aspect-ratio:20/9}
.frame.portrait{width:min(100cqw,100cqh*9/19.5);aspect-ratio:9/19.5}
.screen{--d:calc(100cqw/860);position:absolute;inset:0;font-size:calc(var(--d)*14)}
.portrait .screen{--d:calc(100cqw/400)}

/* DeckCoverWallBackdrop: deck background + tilted capsule wall + blue corner light */
.wall{position:absolute;inset:0;overflow:hidden}
.wallrot{position:absolute;display:flex;gap:calc(var(--d)*14);transform:rotate(-13deg)}
.col{display:flex;flex-direction:column;gap:calc(var(--d)*14);flex:none;animation:linear 40s infinite}
.col.up{animation-name:up}.col.dn{animation-name:dn}
@keyframes up{to{transform:translateY(calc(var(--run)*-1))}}
@keyframes dn{from{transform:translateY(calc(var(--run)*-1))}to{transform:none}}
.cap{flex:none;width:calc(var(--d)*112);height:calc(var(--d)*168);border-radius:calc(var(--d)*10);background:var(--su) center/cover;border:1px solid color-mix(in srgb,var(--ln) 60%,transparent)}
.light{position:absolute;inset:0}
/* scrim (CenteredStatus gradient) + a soft centre pool so the logo and text stay legible over the wall */
.scrim{position:absolute;inset:0;background:
 radial-gradient(ellipse 60% 70% at 50% 46%,rgba(0,0,0,.66) 0,rgba(0,0,0,.40) 55%,transparent 100%),
 linear-gradient(180deg,rgba(0,0,0,.30) 0,rgba(0,0,0,.28) 45%,rgba(0,0,0,.62) 78%,rgba(0,0,0,.90) 100%)}

/* content */
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--d)*28) calc(var(--d)*28) calc(var(--d)*44)}
.logo{width:calc(var(--d)*170);flex:none}
.portrait .logo{width:calc(var(--d)*240)}
.logo svg{width:100%;height:auto;display:block;overflow:visible}
.logo.still *{animation:none!important}
.t1{margin-top:calc(var(--d)*8);font-size:calc(var(--d)*22);font-weight:700;color:var(--hero);text-align:center;letter-spacing:.1px}
.portrait .t1{font-size:calc(var(--d)*21)}
.game{margin-top:calc(var(--d)*6);font-size:calc(var(--d)*14);color:var(--dim);text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game b{color:var(--hero);font-weight:600}
.prog{margin-top:calc(var(--d)*16);width:calc(var(--d)*320);max-width:100%;display:flex;flex-direction:column;align-items:stretch}
.portrait .prog{width:calc(var(--d)*300)}
.row{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--d)*12)}
.lab{font:500 calc(var(--d)*12)/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:calc(var(--d)*1.4);color:rgba(243,245,248,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.cnt{font:500 calc(var(--d)*12)/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--pr);flex:none}
.pips{display:flex;gap:calc(var(--d)*6);margin-top:calc(var(--d)*10)}
.pips i{flex:1;height:calc(var(--d)*4);border-radius:calc(var(--d)*3);background:color-mix(in srgb,var(--pr) 16%,transparent)}
.pips i.done{background:var(--pr)}.pips i.cur{background:var(--pr);animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:.9}}
.guest{display:flex;align-items:center;gap:calc(var(--d)*14);justify-content:center;color:var(--hero);font-size:calc(var(--d)*14)}
.spin{width:calc(var(--d)*20);height:calc(var(--d)*20);border-radius:50%;border:calc(var(--d)*2.5) solid color-mix(in srgb,var(--pr) 22%,transparent);border-top-color:var(--pr);animation:rot .9s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.hintl{margin-top:calc(var(--d)*12);font-size:calc(var(--d)*12);color:var(--pr);text-align:center;min-height:calc(var(--d)*16);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.btn{font:inherit;font-size:calc(var(--d)*14);font-weight:500;color:var(--hero);background:transparent;border:1px solid rgba(243,245,248,.45);border-radius:calc(var(--d)*20);min-height:calc(var(--d)*40);padding:0 calc(var(--d)*20);cursor:pointer;outline:none;transition:box-shadow .12s,transform .12s;display:inline-flex;align-items:center}
.btn.primary{background:var(--pr);border-color:var(--pr);color:var(--onpr);font-weight:700}
.btn:focus{box-shadow:0 0 0 calc(var(--d)*2) var(--pr),0 0 calc(var(--d)*14) color-mix(in srgb,var(--pr) 55%,transparent);transform:scale(1.04)}
.btn.primary:focus{box-shadow:0 0 0 calc(var(--d)*2) var(--onpr),0 0 0 calc(var(--d)*4) var(--pr)}
.cancel{margin-top:calc(var(--d)*14);align-self:center}
/* slim bar (status screen) */
.sbar{width:calc(var(--d)*190);height:calc(var(--d)*5);border-radius:calc(var(--d)*4);background:rgba(255,255,255,.16);overflow:hidden;position:relative;align-self:center}
.sbar i{position:absolute;top:0;bottom:0;width:40%;border-radius:inherit;background:var(--pr);animation:slide 1.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes slide{from{left:-40%}to{left:100%}}
.sub{font-size:calc(var(--d)*14);color:rgba(243,245,248,.75);text-align:center;margin-bottom:calc(var(--d)*14)}
.clock{margin-top:calc(var(--d)*10);font-size:calc(var(--d)*12);color:rgba(243,245,248,.55);text-align:center}
/* failure card (FailureCard) */
.card{background:var(--su);border:.5px solid var(--ln2);border-radius:calc(var(--d)*14);padding:calc(var(--d)*18);box-shadow:0 calc(var(--d)*8) calc(var(--d)*24) rgba(0,0,0,.5);width:calc(var(--d)*420);max-width:100%;margin-top:calc(var(--d)*14);text-align:left}
.portrait .card{width:100%}
.chip{display:inline-block;background:var(--errc);color:var(--onerr);border-radius:99px;font-size:calc(var(--d)*11);padding:calc(var(--d)*3) calc(var(--d)*10)}
.card h3{margin-top:calc(var(--d)*12);font-size:calc(var(--d)*15);font-weight:700;color:#e6e6e6}
.card pre{margin-top:calc(var(--d)*6);font:calc(var(--d)*12)/1.35 ui-monospace,Menlo,Consolas,monospace;color:#9AA3AF;white-space:pre-wrap}
.card .note{margin-top:calc(var(--d)*10);font-size:calc(var(--d)*12);color:#9AA3AF}
.card .acts{display:flex;justify-content:flex-end;gap:calc(var(--d)*8);margin-top:calc(var(--d)*12)}
.card .btn{border-color:var(--ln2);color:#e6e6e6}.card .btn.primary{border-color:var(--pr);color:var(--onpr)}
/* controller hints + toast */
.keys{position:absolute;left:0;right:0;bottom:calc(var(--d)*12);display:flex;justify-content:center;gap:calc(var(--d)*18);font-size:calc(var(--d)*12);color:rgba(243,245,248,.7)}
.keys span{display:inline-flex;align-items:center;gap:calc(var(--d)*6)}
.keys i{font-style:normal;font-weight:700;min-width:calc(var(--d)*20);height:calc(var(--d)*20);border-radius:calc(var(--d)*10);border:1px solid rgba(243,245,248,.5);display:inline-grid;place-items:center;padding:0 calc(var(--d)*5);font-size:calc(var(--d)*11)}
.toast{position:absolute;left:50%;top:calc(var(--d)*16);transform:translateX(-50%);background:rgba(18,20,23,.94);border:1px solid var(--ln2);border-radius:99px;padding:calc(var(--d)*8) calc(var(--d)*16);font-size:calc(var(--d)*13);color:#e6e6e6;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5;white-space:nowrap}
.toast.show{opacity:1}
/* hand-off: the overlay fades, the game is behind it */
.ov{position:absolute;inset:0;transition:opacity .25s}
.ov.gone{opacity:0;pointer-events:none}
.game-bg{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#4a505a;font-size:calc(var(--d)*14)}
</style></head><body>

var GAME={name:'Cyberpunk 2077',meta:'P11 ARM · 1280x720'};
var STEPS=[null,'Preparing container…','Preparing Wine & graphics driver…','Building environment…','Launching Windows…'];
var HINT_SLOW='Taking longer than usual — first launch can compile shaders. Not frozen, please wait.';
var HINT_STILL='Still working. If this seems stuck, check the log.';
var $=function(s){return document.querySelector(s)},$$=function(s){return [].slice.call(document.querySelectorAll(s))};
var S={mode:'launch',phase:'setup',step:1,tail:'',hint:null,elapsed:0};
var timers=[],clock=null;

/* ===== backdrop: the real DeckCapsuleWall geometry (112x168 capsules, 14 gap, -13deg tilt, 40 s drift) ===== */
function buildWall(){
  var scr=$('#screen'),d=scr.clientWidth/($('#frame').classList.contains('portrait')?400:860);
  var W=scr.clientWidth/d,H=scr.clientHeight/d,capW=112,capH=168,gap=14,t=13*Math.PI/180;
  var wallW=(W*Math.cos(t)+H*Math.sin(t))*1.1,wallH=Math.max(H*2.4,(W*Math.sin(t)+H*Math.cos(t))*1.1);
  var cols=Math.floor((wallW+gap)/(capW+gap))+1,per=Math.floor((wallH+gap)/(capH+gap))+1,run=(capH+gap)*per,h='';
  for(var c=0;c<cols;c++){
    h+='<div class="col '+(c%2?'dn':'up')+'" style="--run:calc(var(--d)*'+run+')">';
    for(var i=0;i<per*2;i++)h+='<div class="cap" style="background-image:url('+COVERS[(c*5+(i%per)*3)%COVERS.length]+')"></div>';
    h+='</div>';
  }
  $('#wall').innerHTML='<div class="wallrot" style="width:calc(var(--d)*'+wallW+');height:calc(var(--d)*'+wallH+');left:calc(var(--d)*'+(-(wallW-W)/2)+');top:calc(var(--d)*'+(-(wallH-H)/2)+')">'+h+'</div>';
  var r=460,cx=W-r*.35,cy=r*.35;
  $('#light').style.cssText='background:radial-gradient(circle calc(var(--d)*'+r+') at calc(var(--d)*'+cx+') calc(var(--d)*'+cy+'),rgba(26,159,255,.24) 0,rgba(26,159,255,.10) 33%,rgba(26,159,255,.04) 67%,transparent 100%)';
}

/* ===== render: mirrors PreloaderUi (phase SETUP / GUEST / FAILED, or the centered status) ===== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function clockTxt(){var m=Math.floor(S.elapsed/60),s=S.elapsed%60;return 'Elapsed '+m+':'+(s<10?'0':'')+s}
function render(){
  var st=S.mode==='status',failed=S.phase==='failed',p='',k='';
  $('#logo').classList.toggle('still',failed);
  $('#t1').textContent=st?'Shutting down…':'Starting up';
  $('#game').innerHTML=st?'':'<b>'+esc(GAME.name)+'</b> · '+esc(GAME.meta);
  if(st){
    p=(S.hint?'<div class="sub">'+esc(S.hint)+'</div>':'')+'<div class="sbar"><i></i></div><div class="clock">'+clockTxt()+'</div>';
  }else if(failed){
    p='<div class="card"><span class="chip">Failed · Wine prefix</span><h3>Setup step failed</h3><pre>wineboot exited with code 0xc0000142\nprefix: /data/.../containers/1</pre>'
     +'<div class="acts"><button class="btn primary" data-id="retry">Retry</button></div>'
     +'<div class="note">Log saved to Downloads/WinHub/logs</div>'
     +'<div class="acts"><button class="btn" data-id="log">Open log folder</button><button class="btn" data-id="close">Close</button></div></div>';
    k='<span><i>A</i>Select</span><span><i>B</i>Close</span>';
  }else{
    if(S.phase==='setup'){
      var lab=STEPS[S.step].replace(/[…. ]+$/,''),pips='';
      for(var i=1;i<=4;i++)pips+='<i class="'+(i<S.step?'done':i===S.step?'cur':'')+'"></i>';
      p='<div class="row"><span class="lab">'+esc(lab)+'</span><span class="cnt">'+S.step+' / 4</span></div><div class="pips">'+pips+'</div>';
    }else p='<div class="guest"><span class="spin"></span><span>'+esc(S.tail)+'</span></div>';
    p+=(S.hint?'<div class="hintl">'+esc(S.hint)+'</div>':'')+'<button class="btn cancel" data-id="cancel">Cancel launch</button>';
    k='<span><i>A</i>Cancel launch</span><span><i>B</i>Cancel launch</span>';
  }
  $('#prog').innerHTML=p;$('#keys').innerHTML=k;
  var f=$('#prog [data-id]');if(f)f.focus({preventScroll:true});
}

/* ===== timeline (the real timers are 15 s and 90 s; compressed here so the whole launch fits in a minute) ===== */
function clear(){timers.forEach(clearTimeout);timers=[];clearInterval(clock);clock=null;$('#ov').classList.remove('gone')}
function at(ms,fn){timers.push(setTimeout(fn,ms))}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1800)}
function set(o){for(var k in o)S[k]=o[k];render()}
function mark(n){$$('#bar [data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===n)})}
function play(){
  clear();mark('play');set({mode:'launch',phase:'setup',step:1,tail:'',hint:null});
  at(1800,function(){set({step:2})});at(3800,function(){set({step:3})});at(5400,function(){set({step:4})});
  at(6800,function(){set({phase:'guest',tail:'Waiting for '+GAME.name+' to render…'})});
  at(10500,function(){set({hint:HINT_SLOW})});at(15500,function(){set({hint:HINT_STILL})});
  at(19000,function(){set({tail:'Game window detected…'})});
  at(21000,function(){$('#ov').classList.add('gone');toast('Game visible — overlay gone after the 5 s grace');at(3000,function(){mark('');})});
}
function show(n){
  clear();mark(n);
  if(n==='status'){set({mode:'status',phase:'setup',hint:'Backing up your saves…',elapsed:0});clock=setInterval(function(){S.elapsed++;var c=$('.clock');if(c)c.textContent=clockTxt()},1000);return}
  if(n==='fail')return set({mode:'launch',phase:'failed',hint:null});
  if(n==='guest')return set({mode:'launch',phase:'guest',tail:'Waiting for '+GAME.name+' to render…',hint:null});
  if(n==='slow')return set({mode:'launch',phase:'guest',tail:'Waiting for '+GAME.name+' to render…',hint:HINT_SLOW});
  set({mode:'launch',phase:'setup',step:+n,hint:null});
}
function act(id){
  if(id==='cancel'){clear();mark('');toast('Launch cancelled — back to the Deck');set({phase:'setup',step:1});$('#ov').classList.add('gone')}
  else if(id==='retry')play();
  else if(id==='log')toast('Opens the log folder');
  else if(id==='close'){clear();mark('');toast('Closed — back to the Deck');$('#ov').classList.add('gone')}
}

/* ===== input: touch, keyboard, controller (A confirm, B back/cancel, D-pad focus) ===== */
$('#bar').addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;var s=b.dataset.s;
  if(s==='orient'){var f=$('#frame');f.classList.toggle('portrait');b.textContent=f.classList.contains('portrait')?'Landscape':'Portrait';buildWall();return}
  s==='play'?play():show(s)});
$('#prog').addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(b)act(b.dataset.id)});
function move(dir){
  var els=$$('#prog [data-id]'),a=document.activeElement;if(!els.length)return;if(els.indexOf(a)<0){els[0].focus();return}
  var r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
  els.forEach(function(el){if(el===a)return;var q=el.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,p,s;
    if(dir==='left'){if(dx>=-2)return;p=-dx;s=Math.abs(dy)}if(dir==='right'){if(dx<=2)return;p=dx;s=Math.abs(dy)}
    if(dir==='up'){if(dy>=-2)return;p=-dy;s=Math.abs(dx)}if(dir==='down'){if(dy<=2)return;p=dy;s=Math.abs(dx)}
    var c=p+s*2.2;if(c<bs){bs=c;best=el}});
  if(best)best.focus();
}
function pad(n){
  if(/^(up|down|left|right)$/.test(n))move(n);
  else if(n==='A'){var a=document.activeElement;if(a&&a.dataset&&a.dataset.id)act(a.dataset.id)}
  else if(n==='B'){var b=$('#prog [data-id="close"]')||$('#prog [data-id="cancel"]');if(b)act(b.dataset.id)}
}
var KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'A',Escape:'B',Backspace:'B'};
document.addEventListener('keydown',function(e){var n=KEYS[e.key];if(!n)return;e.preventDefault();pad(n)});
var held={},nxt={};
(function poll(){var gp=(navigator.getGamepads?navigator.getGamepads():[])[0];
  if(gp){var b=gp.buttons,ax=gp.axes,m={A:b[0],B:b[1],up:b[12],down:b[13],left:b[14],right:b[15]},on={};
    Object.keys(m).forEach(function(k){on[k]=m[k]&&m[k].pressed});
    if(ax[0]<-.5)on.left=1;if(ax[0]>.5)on.right=1;if(ax[1]<-.5)on.up=1;if(ax[1]>.5)on.down=1;
    var now=performance.now();Object.keys(on).forEach(function(k){if(on[k]){if(!held[k]){held[k]=1;nxt[k]=now+350;pad(k)}else if(/^(up|down|left|right)$/.test(k)&&now>nxt[k]){nxt[k]=now+90;pad(k)}}else held[k]=0})}
  requestAnimationFrame(poll)})();
window.addEventListener('resize',buildWall);
buildWall();play();
</script></body></html>
