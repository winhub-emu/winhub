name: Nightly Manual Release Build

# RELEASES — nothing is compiled here. This publishes the APKs of the LAST successful
# "CI Build (artifacts only)" run (build-artifacts.yml) as a GitHub release, together with its
# own update.json and the small-update patches (.wh files). A release is ONLY produced here.
# Run the CI build first; the release number you type here only names the published files.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Short in-app update line (optional; otherwise taken from docs/releases/<number>.md)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag (e.g. 1.7, 1.8)'
        required: true
        default: '1.0'
      release_title:
        description: 'Release title (e.g. WinHub 1.0)'
        required: true
        default: 'WinHub 1.0'
      release_number:
        description: 'Release number for the published file names (e.g. 1.7, 1.9-pre1)'
        required: true
        default: '1.0'
      make_prerelease:
        description: 'Pre-release? (true = beta build, not offered to stable users)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: read     # read the build run and download its artifacts

env:
  # The release is published here. Run from this repo, the built-in token is enough. Run from any other
  # repo it needs the secret WINHUB_RELEASE_TOKEN (write access to this one), as GITHUB_TOKEN only
  # reaches the repo the workflow runs in.
  RELEASE_REPO: winhub-emu/winhub

jobs:
  # Phase 0 — the release description, checked BEFORE the ~20 min build so a bad notes
  # file fails in seconds. Every release page uses the house layout: the full notes from
  # docs/releases/<number>.md (required for a stable cut, layout checked) plus the complete
  # list of work merged since the previous stable. See scripts/release_notes.py.
  notes:
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository (full history + tags, for the change list)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Assemble the release description
      env:
        FALLBACK_NOTES: ${{ inputs.release_notes }}
        RELEASE_TITLE: ${{ inputs.release_title }}
      run: |
        ARGS=("${{ inputs.release_number }}" --title "$RELEASE_TITLE" --fallback "$FALLBACK_NOTES")
        [ "${{ inputs.make_prerelease }}" = "true" ] && ARGS+=(--prerelease)
        python3 scripts/release_notes.py "${ARGS[@]}"
        { echo "### In-app update line"; echo; cat short-notes.txt; echo;
          echo "### Release description"; echo; cat release-body.md; } >> "$GITHUB_STEP_SUMMARY"

    - name: Keep it for the publish job
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: |
          release-body.md
          short-notes.txt
        retention-days: 7

  # Phase 1 — find the last successful artifacts-only build that still has its 3 APKs.
  pick:
    runs-on: ubuntu-22.04
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
      sha: ${{ steps.pick.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Pick the last successful build
      id: pick
      run: |
        set -euo pipefail
        ID=""; SHA=""
        while read -r RID RSHA; do
          LIVE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RID}/artifacts" \
                   -q '[.artifacts[] | select(.expired | not) | select(.name | startswith("WinHub-"))] | length')
          if [ "$LIVE" -ge 3 ]; then ID="$RID"; SHA="$RSHA"; break; fi
        done < <(gh run list -R "$GITHUB_REPOSITORY" -w build-artifacts.yml -s success -L 10 \
                   --json databaseId,headSha -q '.[] | "\(.databaseId) \(.headSha)"')
        [ -n "$ID" ] || { echo "::error::no successful 'CI Build (artifacts only)' run with its 3 APKs still available; run it first"; exit 1; }
        echo "run_id=$ID" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "Releasing the build from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${ID} (commit ${SHA})" | tee -a "$GITHUB_STEP_SUMMARY"

  # Phase 2 — small in-app updates. One job per flavor: a direct patch from each of the last
  # PATCH_FROM app releases (stable and pre) to the new APK, each one applied back and checked
  # byte-exact before it is kept. Keyed by the OLD APK's sha256, never by versionCode (dev builds
  # freeze it). Old releases without this flavor have no matching asset and are skipped. A patch
  # failure never blocks the release: that flavor just keeps full-size updates.
  # See scripts/apk_delta.py. The patch files get the .wh extension.
  patches:
    needs: pick
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, ludashi, pubg]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      N: ${{ inputs.release_number }}
      TAG: ${{ inputs.release_tag }}
      F: ${{ matrix.flavor }}
      PATCH_FROM: 8
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        sparse-checkout: scripts

    - name: Download the new ${{ matrix.flavor }} APK from the build
      uses: actions/download-artifact@v4
      with:
        pattern: WinHub-*-${{ matrix.flavor }}
        path: new
        merge-multiple: true
        run-id: ${{ needs.pick.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Make and check the patches
      run: |
        set -euo pipefail
        NEW=$(find new -name '*.apk' | head -n1)
        [ -n "$NEW" ] || { echo "::error::no ${F} APK in the build"; exit 1; }
        mkdir -p patches old
        echo '{}' > "patches/patches-${F}.json"
        gh release list -R "$RELEASE_REPO" --limit 40 --json tagName -q '.[].tagName' | grep -vxF "$TAG" > tags.txt || true
        made=0
        while read -r T && [ "$made" -lt "$PATCH_FROM" ]; do
          A=$(gh api "repos/${RELEASE_REPO}/releases/tags/${T}" \
                -q "[.assets[] | select(.name | test(\"^WinHub-.*-${F}\\\\.apk$\")) | .name] | first // empty")
          [ -n "$A" ] || continue
          gh release download "$T" -R "$RELEASE_REPO" -p "$A" -D old --clobber
          P="WinHub-${N}-${F}-from-${T}.wh"
          echo "== $T ($A)"
          python3 -I scripts/apk_delta.py make "old/$A" "$NEW" "patches/$P"
          if python3 -I scripts/apk_delta.py apply "old/$A" "patches/$P" rebuilt.apk && cmp -s rebuilt.apk "$NEW"; then
            OLD_SHA=$(sha256sum "old/$A" | cut -d' ' -f1)
            jq --arg k "$OLD_SHA" --arg file "$P" --arg from "$T" \
               --arg sha "$(sha256sum "patches/$P" | cut -d' ' -f1)" \
               --argjson size "$(stat -c %s "patches/$P")" \
               '.[$k] = {file:$file, from:$from, size:$size, sha256:$sha}' \
               "patches/patches-${F}.json" > p.tmp && mv p.tmp "patches/patches-${F}.json"
            made=$((made + 1))
          else
            echo "::warning::patch from $T for $F did not rebuild byte-exact, dropped"
            rm -f "patches/$P"
          fi
          rm -f "old/$A" rebuilt.apk
        done < tags.txt
        echo "made $made patches for $F"; cat "patches/patches-${F}.json"
        { echo "### Patches for ${F}"; echo; echo '```json'; cat "patches/patches-${F}.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Keep them for the publish job
      uses: actions/upload-artifact@v4
      with:
        name: patches-${{ matrix.flavor }}
        path: patches/
        retention-days: 7

  # Phase 3 — publish the release: the build's APKs, its update.json and the .wh patches.
  release:
    needs: [notes, pick, patches]
    if: ${{ !cancelled() && needs.pick.result == 'success' && needs.notes.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository at the build's commit
      # Only for versionCode/versionName: they must describe the APKs being released.
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.pick.outputs.sha }}
        sparse-checkout: app/build.gradle

    - name: Download the build's APKs
      uses: actions/download-artifact@v4
      with:
        pattern: WinHub-*
        path: dist
        merge-multiple: true   # all 3 flavor APKs land flat in dist/
        run-id: ${{ needs.pick.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Name the APKs for this release
      run: |
        set -euo pipefail
        N="${{ inputs.release_number }}"
        for f in dist/*.apk; do
          b=$(basename "$f" .apk)
          new="dist/WinHub-${N}-${b##*-}.apk"
          [ "$f" = "$new" ] || mv "$f" "$new"
        done
        for fl in standard ludashi pubg; do
          [ -s "dist/WinHub-${N}-${fl}.apk" ] || { echo "::error::the build has no ${fl} APK"; exit 1; }
        done
        ls -la dist/

    - name: Download the release description
      uses: actions/download-artifact@v4
      with:
        name: release-notes
        path: notes

    - name: Download the patches
      # Missing artifacts (a flavor whose patch job failed) are fine: those users get the full APK.
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: patches-*
        path: patches
        merge-multiple: true

    - name: Get version info
      run: |
        echo "VERSION=$(grep versionName app/build.gradle | head -1 | cut -d '"' -f 2)" >> $GITHUB_ENV

    - name: Generate update.json
      # Drives the in-app updater (UpdateManager). Each release carries its own update.json; the
      # app reads it from releases/latest/download/update.json (stable) or from the newest release
      # that has one (pre-release channel). apkUrl / patches urls are absolute, pointing at this
      # release's own assets. patches = {old APK sha256: {file, url, from, size, sha256}} across all
      # flavors (the sha already says which flavor); apkSha256 = the new APK per package, checked
      # after the rebuild.
      env:
        RELEASE_TITLE: ${{ inputs.release_title }}
      run: |
        VERSION_CODE=$(grep versionCode app/build.gradle | head -1 | grep -oE '[0-9]+' | head -1)
        N="${{ inputs.release_number }}"
        NOTES="$(cat notes/short-notes.txt)"
        [ -z "$NOTES" ] && NOTES="$RELEASE_TITLE"
        BASE="${GITHUB_SERVER_URL}/${RELEASE_REPO}/releases/download/${{ inputs.release_tag }}"
        size() { stat -c %s "dist/WinHub-${N}-$1.apk"; }
        sha() { sha256sum "dist/WinHub-${N}-$1.apk" | cut -d' ' -f1; }
        mkdir -p patches
        jq -s 'add // {}' patches/patches-*.json 2>/dev/null > patches.json || echo '{}' > patches.json
        jq -n \
          --argjson vc "$VERSION_CODE" \
          --arg vn "$VERSION" \
          --arg notes "$NOTES" \
          --arg base "$BASE" \
          --arg std "WinHub-${N}-standard.apk" \
          --arg lud "WinHub-${N}-ludashi.apk" \
          --arg pbg "WinHub-${N}-pubg.apk" \
          --argjson sstd "$(size standard)" --argjson slud "$(size ludashi)" --argjson spbg "$(size pubg)" \
          --arg hstd "$(sha standard)" --arg hlud "$(sha ludashi)" --arg hpbg "$(sha pubg)" \
          --slurpfile p patches.json \
          '{versionCode:$vc, versionName:$vn, notes:$notes, minSupported:1,
            apk:{"com.winhub.hernandez":$std,"com.ludashi.benchmark":$lud,"com.tencent.ig":$pbg},
            apkUrl:{"com.winhub.hernandez":($base+"/"+$std),"com.ludashi.benchmark":($base+"/"+$lud),"com.tencent.ig":($base+"/"+$pbg)},
            size:{"com.winhub.hernandez":$sstd,"com.ludashi.benchmark":$slud,"com.tencent.ig":$spbg},
            apkSha256:{"com.winhub.hernandez":$hstd,"com.ludashi.benchmark":$hlud,"com.tencent.ig":$hpbg},
            patches:($p[0] | map_values(. + {url: ($base + "/" + .file)}))}' \
          > update.json
        echo "Generated update.json:"; cat update.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        repository: ${{ env.RELEASE_REPO }}
        token: ${{ secrets.WINHUB_RELEASE_TOKEN || github.token }}
        tag_name: ${{ inputs.release_tag }}
        # The tag points at the commit the APKs were built from. That commit only exists in the release
        # repo when the workflow runs there; from another repo the tag is created on its default branch.
        target_commitish: ${{ github.repository == env.RELEASE_REPO && needs.pick.outputs.sha || '' }}
        name: ${{ inputs.release_title }}
        # Body = the assembled house-layout description (docs/releases/<number>.md +
        # the change list since the previous stable). It already opens with the centered
        # logo + badges: do NOT prepend a second logo or a raw `git log` table here.
        body_path: notes/release-body.md
        files: |
          dist/WinHub-${{ inputs.release_number }}-standard.apk
          dist/WinHub-${{ inputs.release_number }}-ludashi.apk
          dist/WinHub-${{ inputs.release_number }}-pubg.apk
          update.json
          patches/*.wh
        prerelease: ${{ inputs.make_prerelease == 'true' }}
        # Only a stable cut becomes "latest"; pre-releases never do, so the
        # default (toggle-off) updater keeps pointing at the last stable.
        make_latest: ${{ inputs.make_prerelease != 'true' }}
