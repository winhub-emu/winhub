name: _build (reusable matrix build)

# MATRIX build (drafted 2026-07-12): each flavor (standard/ludashi/pubg) builds in
# its OWN parallel job. Because each runner now packages exactly ONE ~588MB APK, the
# OOM that forced `--no-parallel --max-workers=1` in the old single-job build is gone
# — each job uses full workers. Wall-clock ≈ one flavor's build (~5-7min) instead of
# ~11m41s for three sequential. Build minutes rise (3× setup/checkout) but the repo is
# public so minutes are free → optimise purely for turnaround.
#
# Caching (unchanged from the single-job version, shared across the 3 matrix jobs):
#   - JDK: setup-java preinstalled toolchain
#   - Gradle deps + build cache via gradle/actions/setup-gradle (build cache now
#     actually active via org.gradle.caching=true in gradle.properties)
#   - NDK+cmake cached (key ndk-...); JavaSteam JARs cached (key = upstream commit);
#     LSFG .so cached (key = source hash)
#   All three cache keys are SHARED across the matrix. First run after a key change:
#   the 3 jobs miss concurrently and each rebuilds in parallel (fine — free minutes;
#   actions/cache dedupes the save, first writer wins, others log a harmless skip).
#   Every cache is guarded so a MISS still does the real work; keys self-invalidate on
#   their real input, so each build stays identical to a from-scratch build.

on:
  workflow_call:
    inputs:
      release_number:
        description: 'Label for APK file names'
        required: true
        type: string
    secrets:
      # Samsung Galaxy Performance SDK jar (base64), optional. Supplied only by callers that
      # opt in (test builds). When absent the build proceeds without it and the Galaxy
      # Performance feature stays dormant. The proprietary jar is NEVER committed to the repo.
      GALAXY_PERF_SDK_JAR_B64:
        required: false

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false          # one flavor failing must NOT cancel the others
      matrix:
        flavor:
          - { id: standard, task: assembleStandardRelease }
          - { id: ludashi,  task: assembleLudashiRelease  }
          - { id: pubg,     task: assemblePubgRelease     }

    name: build (${{ matrix.flavor.id }})

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1          # was 20 — the version step only needs HEAD

    - name: Set up JDK 17 (preinstalled toolchain, no apt)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle (dependency + build cache)
      uses: gradle/actions/setup-gradle@v4

    - name: Resolve JavaSteam upstream commit (for cache key)
      id: jsref
      run: |
        SHA=$(git ls-remote https://github.com/joshuatam/JavaSteam gamenative-latest 2>/dev/null | head -1 | cut -f1)
        [ -z "$SHA" ] && SHA="unknown"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "JavaSteam gamenative-latest = $SHA"

    - name: Cache JavaSteam JARs
      id: cache-javasteam
      uses: actions/cache@v4
      with:
        path: app/libs/steam
        key: javasteam-${{ steps.jsref.outputs.sha }}

    - name: Build JavaSteam and copy JARs to app/libs/steam
      if: steps.cache-javasteam.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 -b gamenative-latest https://github.com/joshuatam/JavaSteam javasteam_src
        cd javasteam_src

        HW_FILE=$(find . -name "HardwareUtils.java" 2>/dev/null | head -1)
        if [ -n "$HW_FILE" ]; then
          sed -i 's/SystemUtils\.IS_OS_ANDROID/false/g' "$HW_FILE"
        fi

        UTILS_FILE=$(find . -name "Utils.java" -path "*/javasteam/*" 2>/dev/null | head -1)
        if [ -n "$UTILS_FILE" ]; then
          sed -i \
            -e 's/SystemUtils\.IS_OS_MAC_OSX_SONOMA/false/g' \
            -e 's/SystemUtils\.IS_OS_MAC_OSX_VENTURA/false/g' \
            -e 's/SystemUtils\.IS_OS_MAC_OSX_MONTEREY/false/g' \
            -e 's/SystemUtils\.IS_OS_MAC_OSX_BIG_SUR/false/g' \
            -e 's/SystemUtils\.IS_OS_WINDOWS_11/false/g' \
            "$UTILS_FILE"
        fi

        ./gradlew jar --no-daemon 2>&1 | tail -20

        MAIN_JAR=""
        for j in $(find . -name "*.jar" -path "*/build/libs/*" \
            | grep -v "sources\|javadoc\|test" | sort); do
          if jar tf "$j" 2>/dev/null | grep -q "SteamClient.class"; then
            MAIN_JAR="$j"
            break
          fi
        done
        if [ -z "$MAIN_JAR" ]; then
          MAIN_JAR=$(find . -name "*.jar" -path "*/build/libs/*" \
            | grep -v "sources\|javadoc\|test" \
            | while read f; do echo "$(wc -c < "$f") $f"; done \
            | sort -rn | head -1 | cut -d' ' -f2-)
        fi

        DD_JAR=$(find . -name "javasteam-depotdownloader-*.jar" -path "*/build/libs/*" \
          ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -1)

        mkdir -p ../app/libs/steam
        cp "$MAIN_JAR" ../app/libs/steam/javasteam.jar

        PROTO_JAR=$(find ~/.gradle/caches -name "protobuf-java-*.jar" \
          ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -1)
        [ -n "$PROTO_JAR" ] && cp "$PROTO_JAR" ../app/libs/steam/protobuf-java.jar

        LANG3_JAR=$(find ~/.gradle/caches -name "commons-lang3-*.jar" \
          ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | sort -V | tail -1)
        if [ -n "$LANG3_JAR" ]; then
          cp "$LANG3_JAR" ../app/libs/steam/commons-lang3.jar
        else
          wget -q "https://repo1.maven.org/maven2/org/apache/commons/commons-lang3/3.14.0/commons-lang3-3.14.0.jar" \
            -O ../app/libs/steam/commons-lang3.jar
        fi

        if [ -n "$DD_JAR" ] && [ -s "$DD_JAR" ]; then
          cp "$DD_JAR" ../app/libs/steam/javasteam-depotdownloader.jar
          GRADLE_CACHE=~/.gradle/caches/modules-2/files-2.1
          gather_jar() {
            local pattern="$1" dest="$2"
            local found
            found=$(find "$GRADLE_CACHE" -name "$pattern" \
              ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | sort -V | tail -1)
            [ -n "$found" ] && cp "$found" "$dest"
          }
          gather_jar "ktor-client-cio-jvm-*.jar"            "../app/libs/steam/ktor-client-cio.jar"
          gather_jar "ktor-client-core-jvm-*.jar"           "../app/libs/steam/ktor-client-core.jar"
          gather_jar "ktor-io-jvm-*.jar"                    "../app/libs/steam/ktor-io.jar"
          gather_jar "ktor-http-jvm-*.jar"                  "../app/libs/steam/ktor-http.jar"
          gather_jar "ktor-utils-jvm-*.jar"                 "../app/libs/steam/ktor-utils.jar"
          gather_jar "ktor-network-jvm-*.jar"               "../app/libs/steam/ktor-network.jar"
          gather_jar "ktor-network-tls-jvm-*.jar"           "../app/libs/steam/ktor-network-tls.jar"
          gather_jar "kotlinx-serialization-json-jvm-*.jar" "../app/libs/steam/kotlinx-serialization-json.jar"
          gather_jar "kotlinx-serialization-core-jvm-*.jar" "../app/libs/steam/kotlinx-serialization-core.jar"
          gather_jar "kotlinx-io-core-jvm-*.jar"            "../app/libs/steam/kotlinx-io-core.jar"
        fi

    - name: Cache NDK + cmake
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ${{ env.ANDROID_SDK_ROOT }}/cmake/3.22.1
        key: ndk-26.1.10909125-cmake-3.22.1

    - name: Install NDK (only if not cached) + export ANDROID_NDK_HOME
      run: |
        SDK_ROOT="${ANDROID_SDK_ROOT}"
        mkdir -p "$SDK_ROOT"
        if [ ! -f "$SDK_ROOT/ndk/26.1.10909125/source.properties" ]; then
          if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools/
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest" 2>/dev/null || true
            rm -f /tmp/cmdline-tools.zip
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1"
        else
          echo "NDK already present (cache hit) — skipping sdkmanager install"
        fi
        echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Grant execute permission for build script
      run: chmod +x build-lsfg-android.sh

    # The base rootfs is a 193 MB download on every build and was the single flakiest step in the
    # pipeline (HTTP 504s, and a Connection reset that failed the standard flavor on 2026-07-28).
    # Cache it so only the first build after a change fetches it; a cache hit means no external
    # request at all. Keyed on the sha256 pinned in app/build.gradle, so publishing a new rootfs
    # (new release tag + new hash) invalidates the cache automatically — nothing to remember.
    # NOT committed to the repo: at 193 MB it exceeds GitHub's 100 MB per-file limit, and in LFS it
    # would burn the bandwidth quota and bloat every clone forever.
    - name: Resolve pinned imagefs hash
      id: imagefs-pin
      run: |
        SHA=$(grep -oP 'imageFSSha256\s*=\s*"\K[0-9a-f]{64}' app/build.gradle)
        if [ -z "$SHA" ]; then echo "could not read imageFSSha256 from app/build.gradle" >&2; exit 1; fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Cache base imagefs
      uses: actions/cache@v4
      with:
        path: app/src/main/assets/imagefs.tar.zst
        key: imagefs-${{ steps.imagefs-pin.outputs.sha }}

    # dxvk-nvapi (jp7677/dxvk-nvapi, MIT) for "Unreal Engine HDR: DirectX 11" (core/DxvkNvapi). The
    # release, the tarball's sha256 and each dll's sha256 are pinned in
    # app/src/main/assets/dxvk-nvapi/manifest.json (the one place to bump); the two dlls land next to it.
    # Binaries are never committed (.gitignore), so every build fetches them here (~5 MB), and any hash
    # mismatch fails the build instead of shipping a dll nobody checked.
    - name: Fetch dxvk-nvapi (pinned, sha256-checked) into assets
      run: |
        set -euo pipefail
        D=app/src/main/assets/dxvk-nvapi
        M=$D/manifest.json
        URL=$(jq -r .source "$M"); SHA=$(jq -r .sha256 "$M"); VER=$(jq -r .version "$M")
        curl -fsSL --retry 5 --retry-delay 5 -o /tmp/dxvk-nvapi.tar.gz "$URL"
        echo "$SHA  /tmp/dxvk-nvapi.tar.gz" | sha256sum -c -
        mkdir -p /tmp/dxvk-nvapi
        tar -xzf /tmp/dxvk-nvapi.tar.gz -C /tmp/dxvk-nvapi
        jq -r '.files[] | [.from, .asset, .sha256] | @tsv' "$M" | while IFS=$'\t' read -r FROM ASSET FSHA; do
          cp "/tmp/dxvk-nvapi/$FROM" "$D/$ASSET"
          echo "$FSHA  $D/$ASSET" | sha256sum -c -
        done
        cmp -s /tmp/dxvk-nvapi/LICENSE "$D/LICENSE" \
          || echo "::warning::the dxvk-nvapi $VER LICENSE differs from the copy committed in $D"
        echo "dxvk-nvapi $VER bundled:"; ls -l "$D"

    # --- fake evdev for the Linux runtime session -------------------------------------------
    # NOT the jniLibs libfakeinput.so: that one is built from winlator/fakeinput.cpp against bionic
    # and preloaded into Wine. This is the client's own source, winlator/fakeinput_steam.cpp.
    # The Steam client's own copy, built against glibc for the Linux runtime rootfs. A SEPARATE source
    # from the bionic one preloaded into Wine, so a change for the client cannot reach a Windows game.
    # The native Steam client has no Wine and no XInput, so a pad only reaches it as a real
    # /dev/input/eventN — which is what this serves out of the app's fake-input rings. It goes in
    # assets rather than the rootfs asset so an existing installed runtime picks it up on the next
    # launch instead of waiting on a ~790MB runtime release. Built from source here, never
    # committed, so it cannot drift from the bionic copy.
    - name: Build libfakeinput.so for the Linux runtime (glibc aarch64)
      timeout-minutes: 20
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ftp::Timeout=30"
        $APT update -qq
        $APT install -y -qq g++-aarch64-linux-gnu >/dev/null
        D=app/src/main/assets/linuxfs
        mkdir -p "$D"
        # Statically linked C++ runtime: this is preloaded into every Steam process, and Steam ships
        # its own libstdc++ while rewriting LD_LIBRARY_PATH. Pulling the system one in ahead of it is
        # a version-conflict waiting to happen, and it also makes the library independent of what the
        # rootfs carries. Costs ~1.4MB; only libc.so.6 is left as a dependency.
        aarch64-linux-gnu-g++ -shared -fPIC -O2 -Wall -Wno-attributes -Wno-nonnull-compare -pthread -std=c++17 -static-libstdc++ -static-libgcc \
          -o "$D/libfakeinput.so" app/src/main/cpp/winlator/fakeinput_steam.cpp -ldl
        aarch64-linux-gnu-strip --strip-unneeded "$D/libfakeinput.so"
        NEED=$(aarch64-linux-gnu-readelf -d "$D/libfakeinput.so" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
        echo "NEEDED: $NEED"
        # Only the C++ runtime matters here. Steam ships its own libstdc++ and rewrites
        # LD_LIBRARY_PATH, so a preload pulling the system one in ahead of it is a version conflict;
        # libc and libm are the same library either way and vary only with the toolchain version.
        for bad in libstdc++.so.6 libgcc_s.so.1; do
          if printf '%s\n' "$NEED" | grep -qx "$bad"; then
            echo "::error::libfakeinput.so links $bad — the C++ runtime must stay static"
            exit 1
          fi
        done
        # The interposers are the whole point: if any is missing the client sees no controller.
        SYMS=$(aarch64-linux-gnu-nm -D --defined-only "$D/libfakeinput.so" | awk '{print $NF}')
        for sym in open openat ioctl read close poll ppoll select stat fstat access scandir; do
          grep -qx "$sym" <<<"$SYMS" \
            || { echo "::error::libfakeinput.so does not export $sym"; exit 1; }
        done
        ls -l "$D/libfakeinput.so"
        # The session shim as well, from the same sources the rootfs builds it from. It is what
        # /etc/ld.so.preload names in every runtime since r5, so refreshing it from the app is how a
        # fix inside it reaches a runtime that is already installed - the netlink stand-in in
        # udevmon.c is exactly that, and the device that needs it cannot take a new runtime image.
        $APT install -y -qq gcc-aarch64-linux-gnu >/dev/null
        aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
          -o "$D/libblsession.so" tools/linuxfs/preload/*.c -ldl
        aarch64-linux-gnu-strip --strip-unneeded "$D/libblsession.so"
        for sym in socket bind getsockname setsockopt statfs statvfs; do
          aarch64-linux-gnu-nm -D --defined-only "$D/libblsession.so" | awk '{print $NF}' | grep -qx "$sym" \
            || { echo "::error::libblsession.so does not export $sym"; exit 1; }
        done
        ls -l "$D/libblsession.so"
        # The session's scripts too, so a fix in one reaches an installed runtime the same way.
        for script in tools/linuxfs/overlay/usr/local/bin/bannerlator-*; do
          install -Dm644 "$script" "$D/usr/local/bin/$(basename "$script")"
        done
        # The SteamOS helpers the client calls in Deck mode, as no-op stubs (see each file).
        for f in tools/linuxfs/overlay/usr/bin/* tools/linuxfs/overlay/usr/bin/steamos-polkit-helpers/*; do
          [ -f "$f" ] && install -Dm644 "$f" "$D/${f#tools/linuxfs/overlay/}"
        done
        # The patched gamescope, only once a build of it has been published: tools/gamescope/release.env names the release and the archive's sha256 (see tools/gamescope/PATCHES.md).
        # Without that file nothing is fetched, the apk carries no gamescope, and sessions keep the runtime's own.
        if [ -f tools/gamescope/release.env ]; then
          . tools/gamescope/release.env
          curl -fsSL -o gamescope.tzst "${GAMESCOPE_URL}"
          echo "${GAMESCOPE_SHA256}  gamescope.tzst" | sha256sum -c -
          tar --use-compress-program=unzstd -xf gamescope.tzst -C "$D"
          test -f "$D/usr/local/bin/gamescope"
          rm gamescope.tzst
          echo "patched gamescope staged from ${GAMESCOPE_TAG}"
        else
          echo "no tools/gamescope/release.env: the apk carries no gamescope of its own"
        fi
        # Valve's aarch64 mangoapp for Deck mode's performance overlay, plus the five libraries the runtime lacks, pinned by sha256 in tools/mangoapp/packages.txt.
        # Each library is stored under the SONAME it is loaded by, as a real file, because assets cannot carry symlinks.
        M="$D/usr/local/lib/mangoapp"
        mkdir -p "$M" mango-pkgs
        grep -v '^#' tools/mangoapp/packages.txt | while read -r sum url; do
          [ -n "$url" ] || continue
          # Valve's package servers sometimes reset a connection, and plain --retry does not retry that, so every error is retried.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o mango-pkgs/pkg.tar.zst "$url"
          echo "$sum  mango-pkgs/pkg.tar.zst" | sha256sum -c -
          tar --use-compress-program=unzstd -xf mango-pkgs/pkg.tar.zst -C mango-pkgs
          rm mango-pkgs/pkg.tar.zst
        done
        install -m644 mango-pkgs/usr/bin/mangoapp "$M/mangoapp"
        for so in libfmt.so.10 libspdlog.so.1.13 libglfw.so.3 libtraceevent.so.1 libtracefs.so.1; do
          cp -L "mango-pkgs/usr/lib/$so" "$M/$so"
        done
        install -Dm644 tools/mangoapp/mangoapp "$D/usr/local/bin/mangoapp"
        rm -rf mango-pkgs
        ls -l "$M"
        ls -l "$D/usr/local/bin/"

    # The PulseAudio sink that sends the Steam client's own sound through the DirectAudio relay (tools/aaudio-sink, from The412Banner/SteamDeck).
    # It is compiled against upstream PulseAudio 13 headers and the app's own libpulse*, and added to the audio bundle the apk carries.
    # Only module-directaudio-sink is added: the bundle's own module-aaudio-sink stays as it is, so a session without DirectAudio sounds exactly as before.
    # build.sh compiles both sinks, as a check.
    - name: Cache PulseAudio 13.0 source
      id: pa-src
      uses: actions/cache@v4
      with:
        path: pa13
        key: pulseaudio-src-13.0

    - name: Fetch PulseAudio 13.0 source
      if: steps.pa-src.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        curl -fsSL -o pa.tar.gz https://github.com/pulseaudio/pulseaudio/archive/refs/tags/v13.0.tar.gz
        mkdir -p pa13 && tar -xzf pa.tar.gz -C pa13 --strip-components=1 && rm pa.tar.gz

    - name: Build the DirectAudio sink into the audio bundle
      run: |
        set -euo pipefail
        export NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}}"
        tools/aaudio-sink/build.sh "$PWD/pa13" "$PWD/sink-out"
        rm -rf pa-bundle && mkdir -p pa-bundle
        tar --use-compress-program=unzstd -xf app/src/main/assets/pulseaudio.tzst -C pa-bundle
        before=$(tar --use-compress-program=unzstd -tf app/src/main/assets/pulseaudio.tzst | grep -vc '/$')
        test -f pa-bundle/modules/arm64/module-aaudio-sink.so
        install -m755 sink-out/module-directaudio-sink.so pa-bundle/modules/arm64/module-directaudio-sink.so
        (cd pa-bundle && tar --use-compress-program='zstd -19' -cf ../pulseaudio.tzst .)
        mv pulseaudio.tzst app/src/main/assets/pulseaudio.tzst
        after=$(tar --use-compress-program=unzstd -tf app/src/main/assets/pulseaudio.tzst | grep -vc '/$')
        echo "audio bundle: $before files before, $after after"
        # Exactly one entry more, counted the same way on both sides: the whole bundle is never swapped, only the sink added to it.
        test "$after" -eq $((before + 1))
        # No grep -q: it exits on the first hit, SIGPIPEs tar mid-listing and pipefail turns that into a red build.
        tar --use-compress-program=unzstd -tf app/src/main/assets/pulseaudio.tzst | grep -F 'module-directaudio-sink.so' >/dev/null
        rm -rf pa-bundle sink-out

    - name: Cache LSFG native library
      id: cache-lsfg
      uses: actions/cache@v4
      with:
        path: app/src/main/jniLibs/arm64-v8a/libVkLayer_LSFGVK_frame_generation.so
        key: lsfg-${{ hashFiles('app/src/main/cpp/lsfg-vk/**', 'build-lsfg-android.sh') }}

    - name: Build LSFG native library (only if not cached)
      if: steps.cache-lsfg.outputs.cache-hit != 'true'
      run: ./build-lsfg-android.sh

    # --- bl-steam-client: the native Rust Steam CM engine (libblsteam.so) --------------------
    # Cross-compiled with cargo for aarch64-linux-android and dropped into jniLibs so it ships in
    # every flavor exactly like the other prebuilt .so files. rustup/cargo are preinstalled on the
    # runner image; only the Android target has to be added. The one C-compiling crate (`ring`,
    # via rustls) needs the NDK clang/llvm-ar exported below — everything else is pure Rust.
    # Cache = cargo registry + the crate's target/ dir, keyed on rustc version + Cargo.lock, so a
    # source-only change rebuilds just this crate on top of the cached dependency objects.
    - name: Rust toolchain (aarch64-linux-android target)
      id: rust
      run: |
        rustup target add aarch64-linux-android
        echo "rustc=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        rustc -V; cargo -V

    - name: Cache cargo registry + bl-steam-client target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          app/src/main/cpp/bl-steam-client/rust/target
        key: blsteam-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/cpp/bl-steam-client/rust/Cargo.lock') }}
        restore-keys: |
          blsteam-${{ steps.rust.outputs.rustc }}-

    - name: Build libblsteam.so (cargo, aarch64-linux-android)
      run: |
        NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
        test -x "$NDK_BIN/aarch64-linux-android26-clang" || { echo "NDK clang missing at $NDK_BIN" >&2; exit 1; }
        export PATH="$NDK_BIN:$PATH"
        export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
        export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
        cd app/src/main/cpp/bl-steam-client/rust
        cargo build --locked --release --target aarch64-linux-android --lib
        SO=target/aarch64-linux-android/release/libblsteam.so
        test -s "$SO"
        # Rebrand + packaging assertion: the JNI entry point Kotlin binds at boot must be exported,
        # otherwise the boot probe (BlSteamClient.probe) fails silently on device.
        "$NDK_BIN/llvm-nm" -D --defined-only "$SO" \
          | grep -q ' Java_com_winhub_hernandez_store_blsteam_BlSteamClient_nativeVersion$' \
          || { echo "libblsteam.so lacks the BlSteamClient_nativeVersion JNI export" >&2; exit 1; }
        "$NDK_BIN/llvm-readelf" -d "$SO" | grep -i soname
        ls -la "$SO"
        mkdir -p ../../../jniLibs/arm64-v8a
        cp "$SO" ../../../jniLibs/arm64-v8a/libblsteam.so

    - name: bl-steam-client host unit tests (informational, non-blocking)
      # Bounded: one pubg job sat in this step for 25+ minutes on 2026-09-21 while its siblings
      # finished it in 11 s, and with no limit it would have held the build to GitHub's six-hour
      # job cap. Informational means it must never hold a build; a hang is a failure to report.
      timeout-minutes: 8
      # The crate carries 224 #[test] functions that have never executed ANYWHERE. The build
      # step above cross-compiles for the device, and `cargo build` excludes #[cfg(test)] code
      # by design - so today those tests are neither run NOR compiled, and every one of them
      # could be broken without turning this workflow red.
      #
      # They are pure host-side logic (wire encoding, protobuf field numbers, EMsg values), so
      # they need no device, no NDK and no Steam session - hence a plain `cargo test` with no
      # --target, which compiles and runs for the runner's own architecture.
      #
      # Deliberately non-blocking on this first run: the point is to LEARN whether they pass,
      # and a failure must not cost us the APK. Note the crate has cfg(target_os = "android")
      # blocks in jni.rs and depot_writer.rs, so a host build may not even compile - that
      # outcome is itself the answer we are after. Make this blocking once it is known-green.
      continue-on-error: true
      run: |
        cd app/src/main/cpp/bl-steam-client/rust
        cargo test --locked

    - name: bl-steam-client dependency audit (cargo tree + licenses)
      run: |
        cd app/src/main/cpp/bl-steam-client/rust
        echo "== crates linked into libblsteam.so (aarch64-linux-android; normal+build deps) =="
        cargo tree --locked --target aarch64-linux-android -e normal,build --prefix none --format '{p} {l}' | sort -u
        echo "== -sys crates =="
        cargo tree --locked --target aarch64-linux-android -e normal,build --prefix none --format '{p}' | sort -u | grep -- '-sys' || echo "(none)"

    # --- Xbox store backend (tools/xbox): Xodus built for Android ---------------------------------------
    # xodus-cli / xodus-service for aarch64-linux-android (tools/xbox/build-android.sh: DroidDeck's
    # recipe, pinned sources and patches) as jniLibs, plus the five Xodus Nexus Windows modules and the
    # licences as assets/xbox. Keyed on tools/xbox; build-xbox-android.yml saves the same key, so this
    # normally restores (~40 MB). Small enough to save on any branch.
    - name: Restore the Xbox backend (keyed on tools/xbox)
      id: xbox-backend
      uses: actions/cache/restore@v4
      with:
        path: build-xbox/out
        key: xbox-out-${{ hashFiles('tools/xbox/**') }}

    - name: Build the Xbox backend (only if not cached)
      if: steps.xbox-backend.outputs.cache-hit != 'true'
      timeout-minutes: 60
      run: bash tools/xbox/build-android.sh build-xbox/out

    - name: Save the Xbox backend
      if: steps.xbox-backend.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: build-xbox/out
        key: xbox-out-${{ hashFiles('tools/xbox/**') }}

    - name: Stage the Xbox backend into the APK
      run: |
        set -euo pipefail
        O=build-xbox/out
        install -D -m755 "$O/bin/libxodus_cli.so" app/src/main/jniLibs/arm64-v8a/libxodus_cli.so
        install -D -m755 "$O/bin/libxodus_service.so" app/src/main/jniLibs/arm64-v8a/libxodus_service.so
        # The CLI built here gets HTTP 400 from user.auth.xboxlive.com on this device; AbuNashmi's build of the same recipe works.
        install -D -m755 tools/xbox-prebuilt/libxodus_cli.so app/src/main/jniLibs/arm64-v8a/libxodus_cli.so
        rm -rf app/src/main/assets/xbox && mkdir -p app/src/main/assets/xbox/windows
        cp "$O"/windows/*.dll app/src/main/assets/xbox/windows/
        cp "$O"/version "$O"/LICENSE.* "$O"/*.lock.json app/src/main/assets/xbox/
        test "$(ls app/src/main/assets/xbox/windows/*.dll | wc -l)" = 6
        ls -l app/src/main/jniLibs/arm64-v8a/libxodus_*.so app/src/main/assets/xbox app/src/main/assets/xbox/windows

    # bxsaveup.exe (app/src/main/cpp/xbox-saveup): uploads an Xbox game's pending container saves after the game
    # exited (store/xbox/XboxSaveSync on the shutdown screen). x86_64, like the Nexus modules it loads. Built
    # with the pinned bylaws/llvm-mingw; not under tools/xbox so the backend cache key is kept.
    - name: Cache llvm-mingw (Xbox save uploader)
      uses: actions/cache@v4
      with:
        path: ~/.cache/llvm-mingw-bylaws-20250920
        key: llvm-mingw-bylaws-20250920-ubuntu-22.04-x86_64

    - name: Build the Xbox save uploader into assets
      run: |
        set -euo pipefail
        LLVM_MINGW="$HOME/.cache/llvm-mingw-bylaws-20250920"
        if [ ! -x "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" ]; then
          tar_name=llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/$tar_name" \
            "https://github.com/bylaws/llvm-mingw/releases/download/20250920/$tar_name"
          echo "8dd8c34fc051a50c2fae86015f35057f8aae93fe1e19b34537ef1269a8b4c772  $RUNNER_TEMP/$tar_name" | sha256sum -c -
          mkdir -p "$LLVM_MINGW"
          tar -xJf "$RUNNER_TEMP/$tar_name" -C "$LLVM_MINGW" --strip-components=1
        fi
        "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" -std=gnu11 -O2 -Wall -Wextra -Werror -s \
          -o app/src/main/assets/xbox/bxsaveup.exe app/src/main/cpp/xbox-saveup/bxsaveup.c
        ls -l app/src/main/assets/xbox/bxsaveup.exe

    - name: Restore Galaxy Performance SDK jar (optional, from secret)
      # Decodes the proprietary Samsung jar from the encrypted secret into the git-ignored
      # drop-point so app/build.gradle bundles it. No secret => no jar => feature dormant.
      # The secret value is piped, never echoed, so it cannot leak into the log.
      env:
        GALAXY_JAR_B64: ${{ secrets.GALAXY_PERF_SDK_JAR_B64 }}
      run: |
        if [ -n "$GALAXY_JAR_B64" ]; then
          mkdir -p app/libs/GalaxyPerf
          printf '%s' "$GALAXY_JAR_B64" | base64 -d > app/libs/GalaxyPerf/perfsdk-v1.0.0.jar
          echo "Galaxy Performance SDK restored: $(wc -c < app/libs/GalaxyPerf/perfsdk-v1.0.0.jar) bytes"
        else
          echo "No Galaxy SDK secret set — building without it (Galaxy feature dormant)."
        fi

    - name: Build with Gradle
      # ONE flavor per job → only one ~588MB APK packages here, so the old
      # `--no-parallel --max-workers=1` OOM-guard is dropped; full workers now.
      # org.gradle.caching=true (gradle.properties) reuses task outputs across runs.
      run: ./gradlew ${{ matrix.flavor.task }} -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g"

    - name: Get version info
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "VERSION=$(grep versionName app/build.gradle | head -1 | cut -d '"' -f 2)" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

    - name: Rename APK
      run: |
        N="${{ inputs.release_number }}"
        F="${{ matrix.flavor.id }}"
        mv app/build/outputs/apk/${F}/release/app-${F}-release.apk \
           app/build/outputs/apk/${F}/release/Bannerlator-${N}-${F}.apk

    - name: Upload ${{ matrix.flavor.id }} APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bannerlator-${{ inputs.release_number }}-${{ matrix.flavor.id }}
        path: app/build/outputs/apk/${{ matrix.flavor.id }}/release/Bannerlator-${{ inputs.release_number }}-${{ matrix.flavor.id }}.apk
        if-no-files-found: error
        retention-days: 7
