name: hermes check

# Fast feedback for the controller-input transport crate (app/src/main/cpp/hermes): host tests,
# the loom model check, and both device builds with their link probes. The full APK build
# (_build.yml) runs the same app/src/main/cpp/hermes/ci/build.sh for the device builds only; the host
# tests and the loom check run here alone.
on:
  push:
    paths:
      - 'app/src/main/cpp/hermes/**'
      - '.github/workflows/hermes-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4

    - name: Toolchains
      id: rust
      run: |
        rustup target add aarch64-linux-android aarch64-unknown-linux-gnu
        echo "rustc=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu >/dev/null
        NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
        test -d "$NDK" || { echo "no NDK on the runner" >&2; exit 1; }
        echo "NDK_BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
        rustc -V; cargo -V; echo "NDK: $NDK"

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          app/src/main/cpp/hermes/target
          app/src/main/cpp/hermes/loom/target
        key: hermes-check-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/cpp/hermes/**/Cargo.toml') }}
        restore-keys: |
          hermes-check-${{ steps.rust.outputs.rustc }}-

    - name: Host tests
      timeout-minutes: 20
      run: app/src/main/cpp/hermes/ci/build.sh test

    - name: Scenario stress (fork scenario x60, whole suite x5)
      if: success() || failure()
      timeout-minutes: 20
      working-directory: app/src/main/cpp/hermes
      run: |
        fails=0
        run() {
          if ! cargo test -q -p hermes-guest "$@" -- --test-threads=1 >/tmp/stress.log 2>&1; then
            fails=$((fails + 1)); echo "--- $* failed:"; grep -v '^$' /tmp/stress.log | tail -40
          fi
        }
        for i in $(seq 1 60); do run forked_reader; done
        for i in $(seq 1 5); do run; done
        echo "scenario stress: $fails of 65 runs failed"
        test "$fails" -eq 0

    - name: Loom model check
      if: success() || failure()
      timeout-minutes: 20
      run: app/src/main/cpp/hermes/ci/build.sh loom

    - name: Android build + link probe
      if: success() || failure()
      run: app/src/main/cpp/hermes/ci/build.sh android

    - name: glibc build + link probes
      if: success() || failure()
      run: app/src/main/cpp/hermes/ci/build.sh glibc
