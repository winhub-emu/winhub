import java.net.URL

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'
    }
}

plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Base rootfs, fetched at build time from OUR OWN pinned release rather than a third party's
// moving branch. It used to come from star-emu/contents at refs/heads/main — no tag, no version,
// no checksum — so whatever sat on someone else's main at build time got baked into the APK, and
// an outage there simply broke the build (HTTP 504s, and a Connection reset that failed the
// standard flavor on 2026-07-28). base-assets-v1 is byte-identical to that upstream as of
// 2026-07-24: this is a pin, not a fork.
//
// The checksum is verified after download and the file is deleted on mismatch, so a corrupt or
// swapped asset fails the build loudly instead of shipping silently. To move to a newer rootfs,
// publish a new tag and update BOTH the URL and the hash together.
tasks.register("downloadImageFS") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File imageFS = new File(assetDir, "imagefs.tar.zst")
    String imageFSURL = "https://github.com/The412Banner/winlator-contents/releases/download/base-assets-v1/imagefs.tar.zst"
    String imageFSSha256 = "7838756e6a05c91afff68f4bf12aa2780f815877753f8dd354e203e99b9caf8a"

    doLast {
        if (!imageFS.exists()) {
            println("ImageFS was not present, downloading...\n")
            new URL(imageFSURL).withInputStream { i -> imageFS.withOutputStream { it << i } }

            def digest = java.security.MessageDigest.getInstance("SHA-256")
            imageFS.eachByte(1024 * 1024) { buf, len -> digest.update(buf, 0, len) }
            def actual = digest.digest().encodeHex().toString()
            if (actual != imageFSSha256) {
                imageFS.delete()
                throw new GradleException(
                    "imagefs.tar.zst checksum mismatch\n  expected ${imageFSSha256}\n  actual   ${actual}\n" +
                    "Deleted the download. Either the release asset changed or the transfer was truncated.")
            }
            println("ImageFS checksum OK (${actual})\n")
        }
    }
}

tasks.register("prepareKotlinBuildScriptModel"){}
preBuild.dependsOn(downloadImageFS)

android {
    namespace 'com.winhub.hernandez'
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 28
        // Version code bumps on ANY cut delivered through the in-app updater — a STABLE cut OR an
        // opt-in pre-release — because the updater only offers a build whose number is higher than
        // installed. It stays frozen only across manually-sideloaded dev/nightly builds (reinstalling
        // the same number over-the-top works, so those sideload installs are unaffected).
        // NB: do NOT write the camel-case build-code token in these comments — release.yml greps
        //     for it and takes head -1; a comment match feeds jq an empty value and the job dies.
        versionCode 90
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
        // Exposes the SDL3 AAR's prefab package to CMake (libsteamctrl.so links SDL3::SDL3).
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    signingConfigs {
        // AOSP testkey (android@android.com, SHA-256 A4:0D:A8:0A:59:D1:70:CA…). A fixed,
        // publicly-known key so every build shares ONE signature — new releases/updates
        // install over a previously installed version instead of forcing an uninstall.
        // Signed with v1 (JAR) + v2 + v3 for broadest installer/OS compatibility.
        testkey {
            storeFile file("${rootDir}/keystore/testkey.p12")
            storeType "PKCS12"
            storePassword "android"
            keyAlias "testkey"
            keyPassword "android"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.testkey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.testkey
            // Several animated-background frames (ab_*, ab_gear_*, ab_quilt_*) and the
            // ic_stat_ab_gear notification icon are GIFs with a .png extension. Release
            // enables PNG crunching by default and AAPT2 rejects them ("file failed to
            // compile"); debug skips crunching. Disable it so release matches debug.
            crunchPngs false
        }
    }

    // Release builds run lintVitalRelease (debug skips it). Don't let a pre-existing
    // lint warning abort the build — we ship the same code that already runs in debug,
    // just non-debuggable + optimized. (No R8 yet: minifyEnabled stays false.)
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    flavorDimensions "version"
    productFlavors {
        standard {
            dimension "version"
            applicationId "com.winhub.hernandez"
            resValue "string", "app_name", "WinHub"
        }
        ludashi {
            dimension "version"
            applicationId "com.ludashi.benchmark"
            resValue "string", "app_name", "WinHub Ludashi"
        }
        pubg {
            dimension "version"
            applicationId "com.tencent.ig"
            resValue "string", "app_name", "WinHub PuBG"
        }
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // lib7zz.so ships a bundled libc++_shared.so next to it; pickFirst in case the native
            // build (or another prebuilt) ever emits its own copy, so packaging never fails on a dup.
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

// We vendor a runtime-safe okhttp3.coroutines.executeAsync shim
// (store/compat/ExecuteAsyncKt.kt) because the real okhttp-coroutines artifact was
// compiled against newer Kotlin/coroutines and throws NoSuchMethodError on our stack.
// The real artifact must NOT be on the classpath or it (a) duplicates the shim's class
// — release dex merge fails with "defined multiple times" — and (b) reintroduces the
// runtime crash. Exclude it everywhere; the shim is the sole provider, as intended.
configurations.all {
    exclude group: 'com.squareup.okhttp3', module: 'okhttp-coroutines'
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // Material's real width/height breakpoints (Compact/Medium/Expanded), used by the Steam
    // storefront to choose top tabs vs. a NavigationRail instead of guessing a dp number.
    // Version comes from the compose-bom above.
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'androidx.appcompat:appcompat:1.4.0'
    // androidx.webkit: gives us setRequestedWithHeaderOriginAllowList(), the only supported
    // way to stop the WebView appending X-Requested-With: <package> to every request.
    // That header is how Google detects an embedded browser and rejects OAuth with
    // 403 disallowed_useragent (the GOG "Sign in with Google" white screen).
    // Feature-gated at runtime via WebViewFeature.isFeatureSupported().
    implementation 'androidx.webkit:webkit:1.11.0'
    // Google's WebRTC (BSD) for the native Xbox Cloud Gaming player (XboxNativePlayerActivity).
    implementation 'io.github.webrtc-sdk:android:125.6422.07'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation files('libs/MidiSynth/MidiSynth.jar')

    // Samsung Galaxy Performance SDK (proprietary, not GPL) — picked up ONLY when the user has
    // supplied the jar (see app/libs/GalaxyPerf/README.md). It is git-ignored and absent in CI;
    // the app loads it by reflection, so this guard keeps builds green with or without it.
    def perfSdkJar = file('libs/GalaxyPerf/perfsdk-v1.0.0.jar')
    if (perfSdkJar.exists()) {
        implementation files(perfSdkJar)
        logger.lifecycle("Galaxy Performance SDK found; bundling ${perfSdkJar.name}")
    }

    // JavaSteam — GameNative's fork (joshuatam/JavaSteam @ gamenative-latest). The depot-downloader
    // module was rewritten to disk-spool chunks (temp files, not RAM) + drop the 8 MB per-thread
    // ThreadLocal decompress window, fixing the large-game OOM (#408/#380: HITMAN 87 GB crashed at
    // every speed tier on the public in.dragonbra:1.8.0 in-memory pipeline). Same published artifact
    // GameNative ships. PINNED to the exact timestamped snapshot (buildNumber 1, the only build that
    // exists) so it is immutable — a re-published -SNAPSHOT cannot silently change what we ship, and
    // byte-identical to the artifact the #408 device-proof build (CI run 32710611783) resolved. The
    // jars+metadata are VENDORED in-repo under vendor/maven/ (see its README) so the build no longer
    // reaches Sonatype at all; transitive deps still come from mavenCentral.
    implementation 'io.github.joshuatam:javasteam:1.8.0.1-26-20260801.180149-1'
    implementation 'io.github.joshuatam:javasteam-depotdownloader:1.8.0.1-26-20260801.180149-1'
    // SDL3 (official 3.4.16 Android release AAR, vendored unmodified under vendor/maven/) for the
    // optional Steam Controller support: only its HIDAPI Steam drivers are enabled at runtime, see
    // SteamControllerBackend. @aar: upstream publishes no POM/module, so ask for the AAR explicitly.
    implementation 'org.libsdl.android:SDL3:3.4.16@aar'
    // JavaSteam pulls protobuf-java only at runtime scope, so the generated proto supertypes
    // (com.google.protobuf.GeneratedMessage / MessageOrBuilder) aren't on the COMPILE classpath.
    // Building a proto request directly from Kotlin (the chat-image web-token mint) needs them
    // visible at compile time. Promote the exact version JavaSteam already ships to compile+runtime
    // (Gradle dedups to one 4.31.1 jar — the same classes already loaded for every CM message).
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okio:okio:3.16.0'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'org.openjsse:openjsse:1.1.7'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.6.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.6.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    // topjohnwu libsu — the ONLY su-invoking dependency in the app. Used exclusively by
    // com.winhub.hernandez.perf.RootManager (the power-user performance toggles' root tier).
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // ProcessLifecycleOwner: the perf revert registry restores sysfs nodes when the whole app
    // goes to background (not just when a single activity stops).
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // JVM unit tests (community-config export round-trip). org.json is a real artifact here so the
    // core's JSONObject calls run on the JVM instead of hitting android.jar's "not mocked" stubs.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
